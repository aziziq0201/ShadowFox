<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore | Electronics Shop</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">TechStore</div>

        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="Search products..."
            >
        </div>

        <a href="cart.html" class="nav-icons">
            🛒 Cart (<span id="cart-count">0</span>)
        </a>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <img src="assets/banners/banner.jpg" alt="Banner">
    </section>

    <!-- Products -->
    <section class="products-section">

        <h2>Featured Products</h2>

        <div class="products">

            <div class="product-card">
                <img src="assets/products/phone.jpg" alt="">
                <h3>Smartphone</h3>
                <p>₹24,999</p>
                <button class="add-cart">Add to Cart</button>
            </div>

            <div class="product-card">
                <img src="assets/products/laptop.jpg" alt="">
                <h3>Laptop</h3>
                <p>₹59,999</p>
                <button class="add-cart">Add to Cart</button>
            </div>

            <div class="product-card">
                <img src="assets/products/headphone.jpg" alt="">
                <h3>Headphones</h3>
                <p>₹2,499</p>
                <button class="add-cart">Add to Cart</button>
            </div>

            <div class="product-card">
                <img src="assets/products/watch.jpg" alt="">
                <h3>Smart Watch</h3>
                <p>₹3,999</p>
                <button class="add-cart">Add to Cart</button>
            </div>

            <div class="product-card">
                <img src="assets/products/keyboard.jpg" alt="">
                <h3>Keyboard</h3>
                <p>₹1,299</p>
                <button class="add-cart">Add to Cart</button>
            </div>

            <div class="product-card">
                <img src="assets/products/mouse.jpg" alt="">
                <h3>Mouse</h3>
                <p>₹799</p>
                <button class="add-cart">Add to Cart</button>
            </div>

        </div>

    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 TechStore | Built by Aziz Iqbal</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
