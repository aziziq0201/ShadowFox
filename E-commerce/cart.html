<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <h1>TechStore</h1>
        <a href="index.html">← Back to Shop</a>
    </nav>

    <section class="cart-page">
        <h2>Your Shopping Cart</h2>

        <div class="cart-item">
            <h3>Products Added</h3>
            <p id="cart-items">0</p>
        </div>

        <button onclick="clearCart()" class="clear-btn">
            Clear Cart
        </button>
    </section>

    <script>
        let count = localStorage.getItem("cartCount") || 0;
        document.getElementById("cart-items").innerText = count;

        function clearCart() {
            localStorage.setItem("cartCount", 0);
            document.getElementById("cart-items").innerText = 0;
        }
    </script>

</body>
</html>
